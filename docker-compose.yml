services:
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey-data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      # `-e` makes valkey-cli exit non-zero on an error reply, so the check
      # stays unhealthy while Valkey answers PING with LOADING.
      test: ["CMD", "valkey-cli", "-e", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/sinoru/swift-ap-relay:latest
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://valkey:6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "8080"]

volumes:
  valkey-data:
